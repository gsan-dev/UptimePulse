# nginx para la SPA (Fase 5.4): todo lo que no sea un fichero estático va a
# index.html (React Router), assets con caché larga (llevan hash en el
# nombre) y cabeceras de seguridad. La CSP permite conectar con cualquier
# origen (connect-src) porque la URL de la API se fija en tiempo de build y
# cambia por despliegue; el resto (scripts, estilos, imágenes) solo desde
# el propio origen y Google Fonts.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src *; frame-ancestors 'self'" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
