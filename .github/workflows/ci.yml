# CI de UptimePulse (Fase 5.4). En cada push y PR:
#   quality  → lint + type-check + build del frontend + npm audit (informativo)
#   test     → unit + integración contra TimescaleDB/Redis reales (npm test)
#   e2e      → Playwright con API, worker y web arrancados de verdad
#   docker   → build de las tres imágenes (y push a GHCR solo en main)
# Un test roto hace fallar "test" o "e2e" y, con la rama protegida, bloquea
# el merge.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint, type-check y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build --workspace=apps/web
      - name: npm audit (informativo, no bloquea)
        run: npm audit --audit-level=high
        continue-on-error: true

  test:
    name: Tests unitarios e integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.30.1-pg16
        env:
          POSTGRES_USER: uptimepulse
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: uptimepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uptimepulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://uptimepulse:ci_password@localhost:5432/uptimepulse
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Los tests de integración crean y migran uptimepulse_test ellos mismos
      # (test/global-setup.ts) a partir de DATABASE_URL.
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.30.1-pg16
        env:
          POSTGRES_USER: uptimepulse
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: uptimepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uptimepulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      CI: "true"
      DATABASE_URL: postgres://uptimepulse:ci_password@localhost:5432/uptimepulse
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_ci_access_secret_1234567890
      JWT_REFRESH_SECRET: ci_refresh_secret_ci_refresh_secret_1234567890
      APP_URL: http://localhost:5173
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      CHECK_REGIONS: local
      WORKER_REGION: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Los nombres de imagen en GHCR van en minúsculas; el repositorio no
      # (gsan-dev/UptimePulse).
      - name: Nombre de imagen en minúsculas
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - name: Login en GHCR (solo en main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
