services:
  postgres:
    # Versión fijada (Fase 5.4): la misma que se verificó en desarrollo y en CI.
    image: timescale/timescaledb:2.30.1-pg16
    container_name: uptimepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uptimepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptimepulse}
      POSTGRES_DB: ${POSTGRES_DB:-uptimepulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uptimepulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uptimepulse-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor SMTP de pruebas (Fase 1.5): captura los emails que envía el
  # worker sin salir a internet ni necesitar una cuenta real de Resend/SES.
  # UI web para verlos en http://localhost:8025 ; API JSON para comprobarlos
  # por script en http://localhost:8025/api/v1/messages.
  mailpit:
    image: axllent/mailpit:latest
    container_name: uptimepulse-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
  redis_data:
