# Stack completo para un despliegue en un solo servidor (Fase 5.4):
#   cp .env.example .env   # y rellena secretos reales (ver docs/DEPLOY.md)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# A diferencia de docker-compose.yml (solo la infraestructura para
# desarrollar), aquí también se construyen y arrancan la API, el worker y el
# frontend. Las migraciones las aplica el servicio "migrate" antes de que
# arranque la API. Sin Mailpit: en producción SMTP_* apunta a un proveedor real.
services:
  postgres:
    image: timescale/timescaledb:2.30.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uptimepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-uptimepulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uptimepulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    command: ["node", "node_modules/.bin/tsx", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-uptimepulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uptimepulse}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-uptimepulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uptimepulse}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET en .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET en .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-300}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      CHECK_REGIONS: ${CHECK_REGIONS:-local}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-UptimePulse <alerts@example.com>}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-uptimepulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uptimepulse}
      REDIS_URL: redis://redis:6379
      CHECK_REGIONS: ${CHECK_REGIONS:-local}
      WORKER_REGION: ${WORKER_REGION:-local}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_HTTP_PORT: 3001
      INCIDENT_FAILURE_THRESHOLD: ${INCIDENT_FAILURE_THRESHOLD:-2}
      CHECK_MAX_PER_HOST_PER_MINUTE: ${CHECK_MAX_PER_HOST_PER_MINUTE:-60}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-UptimePulse <alerts@example.com>}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # URL pública de la API tal y como la ve el navegador.
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
